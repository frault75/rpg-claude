<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1A44" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Palimpsest</title>
    <meta name="description" content="A story-driven, turn-based RPG in procedural HD-2D pixel art." />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(4, 8, 24, 0.92);
        color: #f4e2a8;
        font: 20px 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        text-align: center;
        padding: 24px;
      }
      #rotate .phone {
        width: 46px;
        height: 78px;
        border: 3px solid #e8c76a;
        border-radius: 9px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      canvas#page {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d8c6a2;
        font: italic 18px 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      #loading.error {
        color: #e7a08f;
        font-style: normal;
        padding: 2em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="page"></canvas>
    <div id="loading">Lighting the candles…</div>
    <div id="rotate"><div class="phone"></div><div class="text">Turn your device sideways to play.</div></div>
    <script>
      // Before the game has loaded, speak its language already (the same lines as src/i18n/strings.ts).
      (function () {
        var lang = 'en';
        try {
          var saved = JSON.parse(localStorage.getItem('palimpsest:settings:v1') || '{}').language;
          if (saved === 'en' || saved === 'fr') lang = saved;
          else {
            var prefs = navigator.languages || [navigator.language];
            for (var i = 0; i < prefs.length; i++) {
              var base = String(prefs[i]).toLowerCase().split('-')[0];
              if (base === 'en' || base === 'fr') { lang = base; break; }
            }
          }
        } catch (e) {}
        if (lang !== 'fr') return;
        document.documentElement.lang = 'fr';
        document.getElementById('loading').textContent = 'On allume les cierges…';
        document.querySelector('#rotate .text').textContent = 'Tournez votre appareil pour jouer.';
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
